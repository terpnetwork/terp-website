# terp.network — static site from MinIO path-style keys
#
# Object layout (deploy-sites.sh):
#   s3://static/terp.network/dist/{pages,lib,public,get,pkg}/...
#
# Do NOT put nginx variables in proxy_pass URIs. If proxy_pass contains `$…`,
# nginx forwards the original request URI (/eco) instead of replacing it, so
# every clean URL falls through to index.html. Always rewrite, then
# `proxy_pass http://minio_terp_static;` (no URI, no variables).
#
# Path-style MinIO: Host must be the MinIO endpoint, not terp.network
# (vhost style would treat Host as the bucket name).
#
# Deploy: sudo cp nginx/terp.network.conf /etc/nginx/sites-available/
#         sudo nginx -t && sudo systemctl reload nginx

upstream minio_terp_static {
    server 127.0.0.1:9000;
}

upstream ibc_proxy {
    server 127.0.0.1:8787;
    keepalive 8;
}

map $uri $tn_page {
    /                 /static/terp.network/dist/pages/index.html;
    /eco              /static/terp.network/dist/pages/tabs.html;
    /ibc              /static/terp.network/dist/pages/ibc.html;
    /svg              /static/terp.network/dist/pages/svg.html;
    /no-rick          /static/terp.network/dist/pages/no-rick.html;
    /about            /static/terp.network/dist/pages/about.html;
    /resources        /static/terp.network/dist/pages/snapshots.html;
    /wip              /static/terp.network/dist/pages/wip.html;
    default           "";
}

server {
    listen 80;
    server_name terp.network www.terp.network;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name terp.network www.terp.network;

    # ssl_certificate     /etc/letsencrypt/live/terp.network/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/terp.network/privkey.pem;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Groot2-Static "1" always;

    client_max_body_size 10m;

    # ── Clean URLs → dist/pages/*.html ────────────────────────
    location = /tabs { return 301 /eco; }
    location = /tabs.html { return 301 /eco; }
    location = /ibc.html { return 301 /ibc; }
    location = /svg.html { return 301 /svg; }
    location = /no-rick.html { return 301 /no-rick; }
    location = /about.html { return 301 /about; }
    location = /resources.html { return 301 /resources; }
    location = /snapshots { return 301 /resources; }
    location = /snapshots.html { return 301 /resources; }
    location = /wip.html { return 301 /wip; }

    location ~ ^/(eco|ibc|svg|no-rick|about|resources|wip)?$ {
        rewrite ^ $tn_page break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_pass http://minio_terp_static;
    }

    location = /get {
        rewrite ^ /static/terp.network/dist/get/terp-installer.sh break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_pass http://minio_terp_static;
        default_type text/x-shellscript;
        add_header Content-Disposition 'inline; filename="terp-installer.sh"';
    }

    # ── Site assets (same dist tree) ──────────────────────────
    location /lib/ {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
    location /public/ {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }
    location /pkg/ {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        types { application/wasm wasm; }
        default_type application/javascript;
    }
    location /pages/ {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        add_header Cache-Control "public, max-age=120, must-revalidate";
    }
    location /get/ {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
    }

    # Other buckets (path-style). URI already matches the bucket name.
    location /snapshots/ {
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=120, must-revalidate";
    }
    location /upgrades/ {
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
        add_header Cache-Control "public, max-age=120, must-revalidate";
        types { text/markdown md; }
        default_type text/plain;
    }

    location = /rpc {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.terp.network;
        proxy_pass https://rpc.terp.network/;
    }
    location /rpc/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.terp.network;
        proxy_pass https://rpc.terp.network/;
    }
    location = /lcd { return 301 /lcd/; }
    location /lcd/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.terp.network;
        proxy_pass https://api.terp.network/;
    }
    location = /rpc-testnet {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-rpc.terp.network;
        proxy_pass https://testnet-rpc.terp.network/;
    }
    location /rpc-testnet/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-rpc.terp.network;
        proxy_pass https://testnet-rpc.terp.network/;
    }
    location = /lcd-testnet { return 301 /lcd-testnet/; }
    location /lcd-testnet/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-api.terp.network;
        proxy_pass https://testnet-api.terp.network/;
    }

    location /ibc-proxy/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://ibc_proxy/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        rewrite ^ /static/terp.network/dist$uri break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_pass http://minio_terp_static;
    }
}
