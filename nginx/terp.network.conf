# terp.network: static site from MinIO path-style keys (hardened, load-once shell)
#
# Object layout (scripts/deploy-sites.sh, websites/scripts/s3-common.sh):
#   s3://static/terp.network/dist/{pages,lib,public,get,pkg}/...
#
# Do NOT put nginx variables in proxy_pass URIs. If proxy_pass contains `$...`,
# nginx forwards the original request URI (/eco) instead of replacing it, so
# every clean URL falls through to index.html. Always rewrite, then
# `proxy_pass http://minio-terp-static;` (no URI, no variables).
#
# Path-style MinIO: Host must be the MinIO endpoint, not terp.network
# (vhost style would treat Host as the bucket name).
#
# Upstream names MUST be valid hostnames (hyphens, no underscores):
# `proxy_set_header Host $proxy_host` sends the upstream name as Host, and
# MinIO rejects "minio_terp_static" with 400 InvalidRequest (invalid
# hostname) on every request (seen in testing against MinIO).
#
# HEADER DESIGN: there is deliberately NO `add_header` inside any location.
# nginx drops ALL server-level add_header directives in a location that has
# its own add_header, so the old config served /lib, /public, /pkg, /pages,
# /get, /snapshots, /upgrades and /ibc-proxy WITHOUT the security headers.
# Instead, locations `set` a class variable and the server-level add_header
# lines read per-class values from the maps below.
#
# Deploy: sudo cp nginx-terp.network.conf /etc/nginx/sites-available/terp.network.conf
#         sudo nginx -t && sudo systemctl reload nginx
# Needs nginx >= 1.19 (tested on 1.26.3). The `listen ... http2` form still
# works on 1.25.1+ but prints a deprecation warning; on newer nginx you may
# switch to `listen 443 ssl;` plus `http2 on;`.

upstream minio-terp-static {
    server 127.0.0.1:9000;
    keepalive 16;
}

upstream ibc-proxy-upstream {
    server 127.0.0.1:8787;
    keepalive 8;
}

map $uri $tn_page {
    /                 /static/terp.network/dist/pages/index.html;
    /eco              /static/terp.network/dist/pages/tabs.html;
    /ibc              /static/terp.network/dist/pages/ibc.html;
    /svg              /static/terp.network/dist/pages/svg.html;
    /no-rick          /static/terp.network/dist/pages/no-rick.html;
    /about            /static/terp.network/dist/pages/about.html;
    /resources        /static/terp.network/dist/pages/snapshots.html;
    /wip              /static/terp.network/dist/pages/wip.html;
    default           "";
}

# ── Cache policy ────────────────────────────────────────────────────
# Assets referenced by the build carry ?v=<content hash> (Merkle stamp from
# build.js), so a versioned URL never changes content: cache it for a year.
# Unversioned asset URLs revalidate after 5 minutes.
# Keyed on $request_uri, not $arg_v: the rewrites below drop the query
# string before MinIO, so $arg_v is empty by the time headers are built.
map $request_uri $tn_asset_cc {
    "~[?&]v=[0-9a-f]{6,64}(&|$)"  "public, max-age=31536000, immutable";
    default                       "public, max-age=300, must-revalidate";
}

# nginx gzip turns MinIO's strong ETag into W/"...". Browsers send that back
# in If-None-Match, and MinIO does not match weak tags, so without this every
# revalidation is a full 200. Strip W/ before forwarding (verified: 304).
map $http_if_none_match $tn_inm {
    "~^W/(?<tn_etag>.*)$"  $tn_etag;
    default                $http_if_none_match;
}

# $tn_cache is set per location. HTML is "no-cache": the browser (and the
# shell router's fetch) may keep a copy but must revalidate every time.
# MinIO answers If-None-Match/If-Modified-Since with 304, so this is cheap
# and a deploy shows up on the next navigation. The router also compares
# <meta name="tn-build"> and hard-reloads on a new deploy.
map $tn_cache $tn_cc {
    page      "no-cache";
    asset     $tn_asset_cc;
    install   "no-cache";
    bucket    "public, max-age=120, must-revalidate";
    none      "";
    default   $upstream_http_cache_control;   # rpc/lcd/ibc-proxy: pass through
}

map $tn_cache $tn_expires {
    default   $upstream_http_expires;
    page      "";
    asset     "";
    install   "";
    bucket    "";
}

# CORS: only /public/ (fonts, images, json reused by other sites) is opened
# with "*". Upstream CORS headers are hidden and re-emitted here so a MinIO
# "ACAO: <origin>" can never be sent together with our "*" (duplicate ACAO
# values make browsers reject the response).
map $tn_cors $tn_acao {
    any       "*";
    default   $upstream_http_access_control_allow_origin;
}

# Installer download name for /get.
map $tn_cache $tn_cdisp {
    install   'inline; filename="terp-installer.sh"';
    default   $upstream_http_content_disposition;
}

# ── Content-Security-Policy ─────────────────────────────────────────
# script-src 'unsafe-inline': the pages use inline <script type="module">
#   blocks, inline classic scripts (window.__TN_ASSET_V), and inline onclick=
#   handlers (index/eco). The load-once shell also re-runs a page's inline
#   scripts on soft navigation by inserting new <script> elements. Nonces or
#   hashes cannot cover onclick attributes, and a nonce would switch
#   'unsafe-inline' off. Moving handlers to addEventListener is a follow-up.
# NO 'unsafe-eval': cosmes (esm.sh), cosmjs (jsdelivr) and the bundled
#   protobufjs work without it. protobufjs's inquire() calls eval() inside
#   try/catch and falls back cleanly (verified: Keplr connect path passes
#   with this CSP enforced).
# 'wasm-unsafe-eval': WebAssembly.instantiate for /pkg (passkey / no-rick /
#   zkjwt wasm). This allows wasm only, not JS eval.
# esm.sh + cdn.jsdelivr.net: wallet libs load on Connect only (cosmes),
#   the interchainjs importmap, cosmjs on /no-rick, and @noble/hashes in the
#   flock-proof worker.
# connect-src is enforced as 'self' https: wss: so no IBC counterparty or
#   user-supplied endpoint breaks. A strict allowlist ships alongside as
#   Content-Security-Policy-Report-Only (browser console only). Once it is
#   clean in production, move that connect-src into the enforced policy.
map $host $tn_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; font-src 'self' data: https://fonts.cdnfonts.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
}
map $host $tn_csp_ro {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; font-src 'self' data: https://fonts.cdnfonts.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://terp.network https://*.terp.network wss://*.terp.network https://esm.sh https://cdn.jsdelivr.net https://fonts.cdnfonts.com https://*.polkachu.com https://rpc.osmosis.zone https://lcd.osmosis.zone https://rpc.stargaze-apis.com https://rest.stargaze-apis.com https://rest.stargaze-1.stargaze.app https://rpc.secret.express https://lcd.secret.express https://rpc.jackalprotocol.com https://api.jackalprotocol.com https://rpc.explorebitsong.com https://lcd.explorebitsong.com https://lcd.juno.strange.love; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# ── Method allowlist ────────────────────────────────────────────────
map $uri $tn_api_path {
    "~^/(rpc|lcd|rpc-testnet|lcd-testnet|ibc-proxy|onboard)(/|$)"  1;
    default                                                 0;
}
map "$request_method:$tn_api_path" $tn_bad_method {
    "~^(GET|HEAD):"            0;
    "~^(POST|OPTIONS):1$"      0;
    default                    1;
}

server {
    listen 80;
    server_name terp.network www.terp.network;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name terp.network www.terp.network;

    # ssl_certificate     /etc/letsencrypt/live/terp.network/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/terp.network/privkey.pem;

    server_tokens off;
    autoindex off;

    # Defaults for the per-location class variables (avoids "uninitialized
    # variable" log spam on locations that don't set them).
    set $tn_cache "";
    set $tn_cors "";

    # Methods: the site is GET/HEAD only. POST/OPTIONS are allowed only on
    # the proxied chain APIs (see $tn_bad_method). One check for the whole
    # server gives a clean 405 before any location or upstream runs.
    if ($tn_bad_method) { return 405; }

    # ── Security headers (all responses, all locations; see header design) ──
    add_header Content-Security-Policy $tn_csp always;
    add_header Content-Security-Policy-Report-Only $tn_csp_ro always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Groot2-Static "1" always;
    # Per-location values (empty value = header not sent).
    add_header Cache-Control $tn_cc always;
    add_header Expires $tn_expires always;
    add_header Access-Control-Allow-Origin $tn_acao always;
    add_header Content-Disposition $tn_cdisp always;

    # Headers from MinIO / upstreams that we replace or do not want to leak.
    # MinIO itself sends HSTS, "CSP: block-all-mixed-content", X-XSS-Protection
    # and CORS headers. Passing them through would duplicate ours.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-bucket-region;
    proxy_hide_header X-Minio-Deployment-Id;
    proxy_hide_header X-Ratelimit-Limit;
    proxy_hide_header X-Ratelimit-Remaining;

    # Compression. MinIO serves identity; nginx compresses text types.
    # (gzip turns MinIO's strong ETag into W/"..."; see $tn_inm.)
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm text/plain text/markdown application/xml;

    client_max_body_size 10m;

    # MinIO XML errors (NoSuchKey/AccessDenied) leak bucket and key names.
    # Static locations intercept them and return a plain 404.
    location @tn_notfound {
        internal;
        set $tn_cache none;
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }

    # ── Clean URLs → dist/pages/*.html ────────────────────────
    location = /index.html { return 301 /$is_args$args; }
    location = /tabs { return 301 /eco$is_args$args; }
    location = /tabs.html { return 301 /eco$is_args$args; }
    location = /eco.html { return 301 /eco$is_args$args; }
    location = /ibc.html { return 301 /ibc$is_args$args; }
    location = /svg.html { return 301 /svg$is_args$args; }
    location = /no-rick.html { return 301 /no-rick$is_args$args; }
    location = /about.html { return 301 /about$is_args$args; }
    location = /resources.html { return 301 /resources$is_args$args; }
    location = /snapshots { return 301 /resources$is_args$args; }
    location = /snapshots.html { return 301 /resources$is_args$args; }
    location = /wip.html { return 301 /wip$is_args$args; }
    # Trailing-slash variants (/about/) used to hit MinIO and return XML 404.
    location ~ ^/(eco|ibc|svg|no-rick|about|resources|wip)/$ { return 301 /$1$is_args$args; }

    # Page HTML. Serves hard loads and the shell router's same-origin
    # fetch(path, {headers:{Accept:'text/html'}}). The response is the same
    # for both, so no Vary on Accept is needed. Query args are dropped
    # before MinIO (`?` at the end of the rewrite), so S3 sub-resource
    # APIs (?acl, ?list-type, ?policy, ...) cannot be reached through here.
    location ~ ^/(eco|ibc|svg|no-rick|about|resources|wip)?$ {
        set $tn_cache page;
        rewrite ^ $tn_page? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }

    location = /get {
        set $tn_cache install;
        rewrite ^ /static/terp.network/dist/get/terp-installer.sh? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }

    # ── Site assets (same dist tree) ──────────────────────────
    # /lib, /pkg: ES modules, workers, wasm. Content-Type comes from the
    # object metadata that `mc` sets at upload (.js/.mjs → JS, .wasm →
    # application/wasm, verified). nosniff makes the browser refuse module
    # scripts with a wrong type, so check with curl -I after a deploy.
    location ~ ^/(lib|pkg)/ {
        set $tn_cache asset;
        rewrite ^ /static/terp.network/dist$uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }
    location /public/ {
        set $tn_cache asset;
        set $tn_cors any;
        rewrite ^ /static/terp.network/dist$uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }
    location /pages/ {
        set $tn_cache page;
        rewrite ^ /static/terp.network/dist$uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }
    location /get/ {
        set $tn_cache asset;
        rewrite ^ /static/terp.network/dist$uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }

    # Other buckets (path-style). The URI already matches the bucket name.
    # Bucket roots and query strings are refused, which blocks S3 ListObjects
    # (a directory listing) even if the bucket policy allows anonymous list.
    # The site reads snapshots/upgrades from https://s3.terp.network directly.
    location = /snapshots/ { return 404; }
    location = /upgrades/ { return 404; }
    location /snapshots/ {
        set $tn_cache bucket;
        rewrite ^ $uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }
    location /upgrades/ {
        set $tn_cache bucket;
        rewrite ^ $uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }

    # ── Chain API proxies (POST allowed for JSON-RPC / tx broadcast) ──
    location = /rpc {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.terp.network;
        proxy_pass https://rpc.terp.network/;
    }
    location /rpc/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.terp.network;
        proxy_pass https://rpc.terp.network/;
    }
    location = /lcd { return 301 /lcd/; }
    location /lcd/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.terp.network;
        proxy_pass https://api.terp.network/;
    }
    location = /rpc-testnet {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-rpc.terp.network;
        proxy_pass https://testnet-rpc.terp.network/;
    }
    location /rpc-testnet/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-rpc.terp.network;
        proxy_pass https://testnet-rpc.terp.network/;
    }
    location = /lcd-testnet { return 301 /lcd-testnet/; }
    location /lcd-testnet/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet-api.terp.network;
        proxy_pass https://testnet-api.terp.network/;
    }

    # Onboard / feegrant (lib/onboard-client.js). On *.terp.network hosts the
    # client calls same-origin /onboard/status and POST /onboard/v1/*-grant and
    # its comment says "proxied by terp.network nginx", but the old conf had
    # no such location (the live edge answers /onboard/status with index.html).
    # Upstream path layout checked: https://hash.terp.network/onboard/status → 200 JSON.
    location /onboard/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hash.terp.network;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass https://hash.terp.network/onboard/;
    }

    location /ibc-proxy/ {
        set $tn_cors any;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://ibc-proxy-upstream/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Everything else in the dist tree (robots.txt, sitemap.xml, favicon,
    # .well-known, ...). Unknown paths get a plain 404, not MinIO XML.
    location / {
        set $tn_cache asset;
        rewrite ^ /static/terp.network/dist$uri? break;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header If-None-Match $tn_inm;
        proxy_intercept_errors on;
        error_page 403 404 = @tn_notfound;
        proxy_pass http://minio-terp-static;
    }
}
