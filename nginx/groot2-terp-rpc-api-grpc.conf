# morocco-1 public RPC / LCD / gRPC from groot2 hub via nginx + Cloudflare tunnel.
# terpd binds loopback only. Nginx owns LAN + :80 Host maps.
# No seed, no P2P, no /p2p advertise, no /net_info, no /dump_consensus_state.

# ---- LAN RPC (existing pattern; 403s for gossip dumps) ----
server {
    listen 192.168.10.101:26657;
    server_name _;

    allow 127.0.0.1;
    allow 192.168.10.0/24;
    allow 192.168.1.0/24;
    deny all;

    location = /net_info { return 403; }
    location ^~ /net_info { return 403; }
    location = /dump_consensus_state { return 403; }
    location ^~ /dump_consensus_state { return 403; }

    location /websocket {
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# ---- LAN LCD ----
server {
    listen 192.168.10.101:1317;
    server_name _;

    allow 127.0.0.1;
    allow 192.168.10.0/24;
    allow 192.168.1.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:1317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}

# ---- LAN gRPC ----
server {
    listen 192.168.10.101:9090 http2;
    server_name _;

    allow 127.0.0.1;
    allow 192.168.10.0/24;
    allow 192.168.1.0/24;
    deny all;

    location / {
        grpc_pass grpc://127.0.0.1:9091;
        grpc_read_timeout 300s;
        grpc_send_timeout 60s;
    }
}

# ---- Public RPC (Cloudflare tunnel → :80) ----
server {
    listen 80;
    server_name rpc.terp.network;

    location = /net_info { return 403; }
    location ^~ /net_info { return 403; }
    location = /dump_consensus_state { return 403; }
    location ^~ /dump_consensus_state { return 403; }

    location /websocket {
        proxy_pass http://127.0.0.1:26657;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:26657;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
    }
}

# ---- Public LCD ----
server {
    listen 80;
    server_name api.terp.network;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:1317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
    }
}

# ---- Public gRPC (dedicated loopback; CF tunnel http2Origin, not shared :80) ----
server {
    listen 127.0.0.1:19092 http2;
    server_name grpc.terp.network;

    location / {
        grpc_pass grpc://127.0.0.1:9091;
        grpc_read_timeout 300s;
        grpc_send_timeout 60s;
    }
}
