<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="fig-gov-title fig-gov-desc">
  <title id="fig-gov-title">Governance: the gov module, staking weight, parameters, pool spends and upgrades</title>
  <desc id="fig-gov-desc">Inside morocco-1, TERP stakers stake through the staking module and propose and vote (yes, no, abstain, no with veto) in the gov module, which reads staked TERP as voting weight; a validator votes for its delegators unless they vote themselves. Passed proposals change parameters of staking, other modules and gov itself, spend from the community pool, or schedule a software upgrade at a halt height where operators switch binaries, often with Cosmovisor.</desc>
  <style>
    .tf-svg { color: var(--tn-text, CanvasText); fill: currentColor; font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif; }
    .tf-mono { font-family: var(--tn-font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); }
    .tf-dim { opacity: .58; }
    .tf-faint { opacity: .36; }
    .tf-accent { stroke: var(--tn-teal, currentColor); }
    .tf-accent-fill { fill: var(--tn-teal, currentColor); }
    .tf-italic { font-style: italic; }
  </style>
  <g class="tf-svg">
    <defs>
      <pattern id="fig-gov-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="6" x2="6" y2="0" stroke="currentColor" stroke-opacity=".22" stroke-width=".5"/></pattern>
      <pattern id="fig-gov-stipple" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".7" fill="currentColor" opacity=".3"/><circle cx="5" cy="4.5" r=".5" fill="currentColor" opacity=".2"/></pattern>
      <marker id="fig-gov-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker>
    </defs>
    <g class="tf-layer" data-tf="gov-chain"><rect x="160" y="24" width="540" height="468" rx="22" fill="currentColor" fill-opacity=".015" stroke="currentColor" stroke-opacity=".5" stroke-width=".7" stroke-dasharray="6 4"/><text x="180" y="46" text-anchor="start" font-size="10.5" class="tf-mono tf-dim">morocco-1</text></g>
    <g class="tf-layer" data-tf="gov-vote"><circle cx="80" cy="250" r="50" fill="url(#fig-gov-hatch)" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.8"/><circle cx="80" cy="250" r="44" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="80" y="246" text-anchor="middle" font-size="15">stakers</text><text x="80" y="262" text-anchor="middle" font-size="10.5" class="tf-mono tf-dim">TERP</text><path d="M130 250 L338 250" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="240" y="240" text-anchor="middle" font-size="11" class="tf-italic tf-dim">propose · vote</text><text x="240" y="270" text-anchor="middle" font-size="10.5" class="tf-mono tf-dim">yes · no · abstain · veto</text><path d="M110 210 Q150 120 228 112" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="118" y="150" text-anchor="end" font-size="11" class="tf-italic tf-dim">stake</text><text x="80" y="330" text-anchor="middle" font-size="11" class="tf-italic tf-dim">a validator votes for its</text><text x="80" y="344" text-anchor="middle" font-size="11" class="tf-italic tf-dim">delegators unless they</text><text x="80" y="358" text-anchor="middle" font-size="11" class="tf-italic tf-dim">vote themselves</text></g>
    <g class="tf-layer" data-tf="gov-staking"><circle cx="280" cy="112" r="50" fill="currentColor" fill-opacity=".02" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.8"/><circle cx="280" cy="112" r="44" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="280" y="108" text-anchor="middle" font-size="15">staking</text><text x="280" y="124" text-anchor="middle" font-size="10.5" class="tf-mono tf-dim">module</text><path d="M310 152 L372 196" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="356" y="160" text-anchor="start" font-size="11" class="tf-italic tf-dim">voting weight</text></g>
    <g class="tf-layer" data-tf="gov-module"><circle cx="420" cy="260" r="80" fill="url(#fig-gov-stipple)" stroke="currentColor" stroke-opacity="0.75" stroke-width="1"/><circle cx="420" cy="260" r="74" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="420" y="256" text-anchor="middle" font-size="18">gov</text><text x="420" y="274" text-anchor="middle" font-size="10.5" class="tf-mono tf-dim">module</text></g>
    <g class="tf-layer" data-tf="gov-self"><path d="M392 334 C380 392 460 392 448 334" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="420" y="404" text-anchor="middle" font-size="11" class="tf-italic tf-dim">its own params</text></g>
    <g class="tf-layer" data-tf="gov-params"><circle cx="620" cy="100" r="46" fill="currentColor" fill-opacity=".02" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.8"/><circle cx="620" cy="100" r="40" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="620" y="96" text-anchor="middle" font-size="13.5">other</text><text x="620" y="112" text-anchor="middle" font-size="13.5">modules</text><path d="M482 208 L578 124" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="540" y="182" text-anchor="start" font-size="11" class="tf-italic tf-dim">params</text><path d="M350 222 Q300 190 300 166" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width=".7" stroke-dasharray="3 3" marker-end="url(#fig-gov-arrow)"/><text x="296" y="196" text-anchor="end" font-size="11" class="tf-italic tf-dim">params</text></g>
    <g class="tf-layer" data-tf="gov-pool"><circle cx="620" cy="290" r="46" fill="currentColor" fill-opacity=".02" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.8"/><circle cx="620" cy="290" r="40" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="620" y="286" text-anchor="middle" font-size="13.5">community</text><text x="620" y="302" text-anchor="middle" font-size="13.5">pool</text><path d="M500 272 L572 284" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="536" y="266" text-anchor="middle" font-size="11" class="tf-italic tf-dim">spends</text></g>
    <g class="tf-layer" data-tf="gov-upgrade"><circle cx="560" cy="425" r="46" fill="url(#fig-gov-hatch)" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.8"/><circle cx="560" cy="425" r="40" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/><text x="560" y="421" text-anchor="middle" font-size="13.5">upgrade</text><text x="560" y="437" text-anchor="middle" font-size="10.5" class="tf-mono tf-dim">halt height</text><path d="M466 326 L526 390" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".8" marker-end="url(#fig-gov-arrow)"/><text x="482" y="372" text-anchor="end" font-size="11" class="tf-italic tf-dim">upgrade</text><text x="300" y="440" text-anchor="middle" font-size="11" class="tf-italic tf-dim">operators switch binaries</text><text x="300" y="454" text-anchor="middle" font-size="11" class="tf-italic tf-dim">at the halt height,</text><text x="300" y="468" text-anchor="middle" font-size="11" class="tf-italic tf-dim">often with Cosmovisor</text></g>

  </g>
</svg>
