<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512" role="img" aria-labelledby="fig-ibc-title fig-ibc-desc">
  <title id="fig-ibc-title">IBC: signers attest roots, native and Wasm light clients, permissionless relaying</title>
  <desc id="fig-ibc-desc">Terp (morocco-1) is drawn as a boundary. Its ibc module holds a native 07-tendermint light client that stores roots; 08-wasm light clients are separate contracts under a code id in the CosmWasm module, used by ibc. Outside, example counterparties (other chains, servers or services, local devices) each have several signers whose signatures converge on a header or state root. Anyone can relay those headers to the matching client, which checks them, so there is no bridge operator to trust. Packets travel both ways; tokens from other chains appear as ibc/… denoms, and Interchain Accounts let an account control an account on another chain.</desc>
  <style>
    .tf-svg { color: var(--tn-text, CanvasText); fill: currentColor; font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif; }
    .tf-mono { font-family: var(--tn-font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); }
    .tf-dim { opacity: .58; }
    .tf-faint { opacity: .36; }
    .tf-accent { stroke: var(--tn-teal, currentColor); }
    .tf-accent-fill { fill: var(--tn-teal, currentColor); }
    .tf-italic { font-style: italic; }
    .d { fill: currentColor; fill-opacity: .08; stroke-opacity: .9; }
  </style>
