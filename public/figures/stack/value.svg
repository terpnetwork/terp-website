<svg xmlns="http://www.w3.org/2000/svg" width="720" height="525" viewBox="0 0 720 525" role="img" aria-labelledby="fig-value-title fig-value-desc">
  <title id="fig-value-title">Value design: TERP secures and votes, THIOL works and pays</title>
  <desc id="fig-value-desc">TERP is bonded by validators or delegated by holders, and staked TERP is voting weight in governance. Governance changes parameters, community-pool spending and software upgrades. The chain mints THIOL every block, and THIOL pays transaction fees. A block is final once validators holding more than two-thirds of staked TERP have signed it.</desc>
  <style>
    .tf-svg { color: var(--tn-text, CanvasText); fill: currentColor; font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif; }
    .tf-mono { font-family: var(--tn-font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); }
    .tf-dim { opacity: .58; }
    .tf-faint { opacity: .36; }
    .tf-accent { stroke: var(--tn-teal, currentColor); }
    .tf-accent-fill { fill: var(--tn-teal, currentColor); }
    .tf-italic { font-style: italic; }
  </style>
  <g class="tf-svg" transform="translate(0,-35)">
    <defs>
      <pattern id="fig-value-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
        <line x1="0" y1="6" x2="6" y2="0" stroke="currentColor" stroke-opacity=".22" stroke-width=".5"/>
      </pattern>
      <pattern id="fig-value-stipple" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r=".7" fill="currentColor" opacity=".35"/>
        <circle cx="5" cy="4.5" r=".5" fill="currentColor" opacity=".25"/>
      </pattern>
      <marker id="fig-value-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/>
      </marker>
      <marker id="fig-value-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 Z" class="tf-accent-fill"/>
      </marker>
    </defs>


    <g class="tf-layer" data-tf="v-terp">
      <circle cx="130" cy="100" r="36" fill="url(#fig-value-hatch)" stroke="currentColor" stroke-opacity=".6" stroke-width=".9"/>
      <circle cx="130" cy="100" r="30" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/>
      <text x="130" y="98" text-anchor="middle" font-size="15" letter-spacing=".5">TERP</text>
      <text x="130" y="113" text-anchor="middle" font-size="10" class="tf-mono tf-dim">uterp</text>
      <text x="116" y="158" text-anchor="end" font-size="11.5" class="tf-italic tf-dim">stake and voice</text>
    </g>

    <g class="tf-layer" data-tf="v-thiol">
      <circle cx="590" cy="100" r="36" fill="url(#fig-value-stipple)" stroke="currentColor" stroke-opacity=".6" stroke-width=".9"/>
      <circle cx="590" cy="100" r="30" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width=".5"/>
      <text x="590" y="98" text-anchor="middle" font-size="16" letter-spacing=".3">THIOL</text>
      <text x="590" y="113" text-anchor="middle" font-size="10" class="tf-mono tf-dim">uthiol</text>
      <text x="604" y="158" font-size="11.5" class="tf-italic tf-dim">work and fees</text>
    </g>

    <g fill="currentColor" fill-opacity=".03" stroke="currentColor" stroke-width=".8">
      <rect x="298" y="180" width="20" height="20"/>
      <rect x="324" y="180" width="20" height="20"/>
      <rect x="350" y="180" width="20" height="20"/>
      <rect x="376" y="180" width="20" height="20"/>
      <rect x="402" y="180" width="20" height="20"/>
    </g>
    <g stroke="currentColor" stroke-opacity=".45" stroke-width=".5">
      <line x1="303" y1="186" x2="313" y2="186"/>
      <line x1="303" y1="191" x2="310" y2="191"/>
      <line x1="329" y1="186" x2="339" y2="186"/>
      <line x1="329" y1="191" x2="336" y2="191"/>
      <line x1="355" y1="186" x2="365" y2="186"/>
      <line x1="355" y1="191" x2="362" y2="191"/>
      <line x1="381" y1="186" x2="391" y2="186"/>
      <line x1="381" y1="191" x2="388" y2="191"/>
      <line x1="407" y1="186" x2="417" y2="186"/>
      <line x1="407" y1="191" x2="414" y2="191"/>
    </g>
    <text x="360" y="166" text-anchor="middle" font-size="11.5" class="tf-italic tf-dim">final above two-thirds of staked TERP</text>
    <text x="360" y="222" text-anchor="middle" font-size="11.5" class="tf-mono tf-dim">morocco-1</text>

    <g class="tf-layer" data-tf="v-stake">
    <rect x="44" y="330" width="216" height="62" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".5" stroke-width=".7"/>
    <text x="62" y="352" font-size="16">Staking</text>
    <text x="62" y="370" font-size="11.5" class="tf-dim">validators bond TERP</text>
    <text x="62" y="383" font-size="11.5" class="tf-dim">holders delegate it</text>
    <text x="62" y="408" font-size="11.5" class="tf-italic tf-dim">rewards shared with delegators</text>
    </g>

    <g class="tf-layer" data-tf="v-tx">
    <rect x="460" y="330" width="216" height="62" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".5" stroke-width=".7"/>
    <text x="478" y="352" font-size="16">Transactions</text>
    <text x="478" y="370" font-size="11.5" class="tf-dim">paid in THIOL</text>
    <text x="478" y="383" font-size="11.5" class="tf-dim">the working token</text>
    </g>

    <g class="tf-layer" data-tf="v-gov">
    <rect x="230" y="462" width="260" height="76" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".5" stroke-width=".7"/>
    <text x="248" y="484" font-size="16">Governance</text>
    <text x="248" y="502" font-size="11.5" class="tf-dim">staked TERP is voting weight</text>
    <text x="248" y="515" font-size="11.5" class="tf-dim">deposits are paid in TERP</text>
    <text x="248" y="528" font-size="11.5" class="tf-dim">parameters · community pool · upgrades</text>
    </g>

    <g fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width=".9">
      <line x1="130" y1="136" x2="130" y2="330" marker-end="url(#fig-value-arrow)"/>
      <path d="M260 361 L280 361 L280 200 L298 200" marker-end="url(#fig-value-arrow)"/>
      <path d="M422 188 L500 188 L500 100 L554 100" marker-end="url(#fig-value-arrow)"/>
      <line x1="590" y1="136" x2="590" y2="330" marker-end="url(#fig-value-arrow)"/>
      <path d="M460 361 L440 361 L440 200 L422 200" marker-end="url(#fig-value-arrow)"/>
      <path d="M420 462 L420 200" marker-end="url(#fig-value-arrow)"/>
    </g>
    <path d="M200 392 L200 430 L280 430 L280 462" fill="none" class="tf-accent" stroke-width="1.1" marker-end="url(#fig-value-arrow-accent)"/>

    <text x="142" y="240" font-size="11.5" class="tf-italic tf-dim">bond / delegate</text>
    <text x="288" y="300" font-size="11.5" class="tf-italic tf-dim">secures</text>
    <text x="510" y="180" font-size="11.5" class="tf-italic tf-dim">minted each block</text>
    <text x="600" y="240" font-size="11.5" class="tf-italic tf-dim">pays fees</text>
    <text x="448" y="300" font-size="11.5" class="tf-italic tf-dim">transactions</text>
    <text x="210" y="423" font-size="11.5" class="tf-italic tf-dim">voting weight</text>
    <text x="402" y="335" text-anchor="middle" font-size="11.5" class="tf-italic tf-dim" transform="rotate(-90 402 335)">params · community pool · upgrades</text>

  </g>
</svg>
