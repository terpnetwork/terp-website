            display: block;
            background: rgb(var(--tn-teal-rgb) / 0.08);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.25);
            color: var(--tn-teal);
        }

        .name-status.taken {
            display: block;
            background: rgb(var(--tn-coral-rgb) / 0.08);
            border: 1px solid rgb(var(--tn-coral-rgb) / 0.25);
            color: var(--tn-coral);
        }

        .name-status.error {
            display: block;
            background: rgb(var(--tn-purple-rgb) / 0.08);
            border: 1px solid rgb(var(--tn-purple-rgb) / 0.25);
            color: var(--tn-purple);
        }

        /* Pricing info */
        .pricing-info {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .pricing-item {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .pricing-label {
            font-size: var(--eco-label);
            color: rgb(var(--tn-mint-rgb) / max(0.55, var(--tn-alpha-floor)));
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
        }

        .pricing-value {
            font-size: 1rem;
            color: var(--tn-teal);
            font-weight: 500;
        }

        /* Mint button */
        .btn-mint {
            width: 100%;
            background: linear-gradient(135deg, rgb(var(--tn-teal-rgb) / 0.15), rgb(var(--tn-teal-rgb) / 0.08));
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.4);
            color: var(--tn-mint);
            padding: 0.9rem 1.5rem;
            font-family: var(--tn-font);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
        }

        .btn-mint:hover {
            background: linear-gradient(135deg, rgb(var(--tn-teal-rgb) / 0.25), rgb(var(--tn-teal-rgb) / 0.15));
            border-color: rgb(var(--tn-teal-rgb) / 0.6);
            box-shadow: 0 0 25px rgb(var(--tn-halo-rgb) / calc(0.15 * var(--tn-halo-k)));
            transform: translateY(-1px);
        }
        html[data-theme="permissionless"] .btn-mint:hover { box-shadow: 0 0 5.5px rgb(var(--tn-glow-rgb) / calc(0.2 * var(--tn-glow-k))), 0 0 12.5px rgb(var(--tn-glow-rgb) / calc(0.15 * var(--tn-glow-k))), 0 0 25px rgb(var(--tn-glow-2-rgb) / calc(0.1 * var(--tn-glow-k))); }

        .btn-mint:active {
            transform: translateY(0);
        }

        .btn-mint:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 360px;
        }

        .toast {
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            line-height: 1.4;
            backdrop-filter: blur(12px);
            animation: toast-in 0.3s ease forwards;
            border: 1px solid;
        }

        .toast.success {
            background: rgb(var(--tn-teal-rgb) / 0.1);
            border-color: rgb(var(--tn-teal-rgb) / 0.3);
            color: var(--tn-teal);
        }

        .toast.error {
            background: rgb(var(--tn-coral-rgb) / 0.1);
            border-color: rgb(var(--tn-coral-rgb) / 0.3);
            color: var(--tn-coral);
        }

        .toast.info {
            background: rgb(var(--tn-purple-rgb) / 0.1);
            border-color: rgb(var(--tn-purple-rgb) / 0.3);
            color: var(--tn-purple);
        }

        .toast.removing {
            animation: toast-out 0.3s ease forwards;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toast-out {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem 0;
            color: var(--tn-text);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgb(var(--tn-teal-rgb) / 0.2);
            border-top-color: var(--tn-teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: var(--tn-size-display);
                letter-spacing: var(--tn-track-display);
                font-family: var(--tn-font-display);
            }

            .page-subtitle {
                font-size: 0.7rem;
            }

            .header {
                padding: 0.5rem 1rem;
            }

            .header-nav {
                gap: 1rem;
            }

            .nav-link {
                font-size: 0.75rem;
            }

            .name-card {
                padding: 1.5rem;
            }

            .name-input-wrap {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .btn-wallet {
                font-size: 0.7rem;
                padding: 0.4rem 0.6rem;
            }
        }

        /* ─── Documentation Modal ─── */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgb(var(--tn-shade-rgb) / 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            z-index: 1;
            background: rgb(var(--tn-shade-rgb) / 0.95);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.15);
            border-radius: 12px;
            width: 90vw;
            max-width: 580px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgb(var(--tn-shadow-rgb) / calc(0.5 * var(--tn-shadow-k)));
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgb(var(--tn-teal-rgb) / 0.1);
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--tn-mint);
        }

        .modal-close {
            background: none;
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.12);
            color: var(--tn-text);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            color: var(--tn-coral);
            border-color: rgb(var(--tn-coral-rgb) / 0.3);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .doc-section {
            margin-bottom: 1.75rem;
        }

        .doc-section:last-child {
            margin-bottom: 0;
        }

        .doc-heading {
            font-size: var(--eco-text-sm, 0.95rem);
            font-weight: 500;
            color: var(--tn-teal);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
        }

        .doc-text {
            font-size: var(--eco-text, 1rem);
            color: var(--tn-text);
            line-height: 1.65;
        }

        .doc-list {
            list-style: none;
            padding: 0;
        }

        .doc-list li {
            font-size: var(--eco-text, 1rem);
            color: var(--tn-text);
            line-height: 1.6;
            padding: 0.25rem 0 0.25rem 1.2rem;
            position: relative;
        }

        .doc-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: rgb(var(--tn-teal-rgb) / max(0.4, var(--tn-alpha-floor)));
            font-size: 0.75rem;
        }

        .doc-code {
            font-family: var(--tn-font-mono);
            font-size: 0.8rem;
            background: rgb(var(--tn-teal-rgb) / 0.06);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.15);
            border-radius: 3px;
            padding: 0.1rem 0.4rem;
            color: var(--tn-teal);
        }

        .doc-pricing-table {
            margin-top: 0.75rem;
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .doc-pricing-row {
            display: flex;
            justify-content: space-between;
            padding: 0.55rem 0.9rem;
            font-size: 0.8rem;
            border-bottom: 1px solid rgb(var(--tn-teal-rgb) / 0.06);
            color: var(--tn-text);
        }

        .doc-pricing-row:last-child {
            border-bottom: none;
        }

        .doc-pricing-row span:last-child {
            color: var(--tn-teal);
            font-weight: 500;
        }

        .doc-pricing-header {
            background: rgb(var(--tn-teal-rgb) / 0.04);
            font-size: var(--tn-size-label);
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
            color: rgb(var(--tn-mint-rgb) / max(0.5, var(--tn-alpha-floor)));
        }

        .doc-pricing-header span:last-child {
            color: rgb(var(--tn-mint-rgb) / max(0.5, var(--tn-alpha-floor)));
            font-weight: 400;
        }

        /* ─── Unified Wallet Dock ─── */
        .wallet-dock {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .wallet-dock-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: rgb(var(--tn-shade-rgb) / 0.9);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.25);
            border-radius: var(--tn-radius-ctl);
            color: var(--tn-teal);
            font-family: var(--tn-font);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgb(var(--tn-shadow-rgb) / calc(0.5 * var(--tn-shadow-k)));
        }

        .wallet-dock-btn:hover {
            border-color: rgb(var(--tn-teal-rgb) / 0.5);
            background: rgb(var(--tn-teal-rgb) / 0.08);
        }

        .wallet-dock-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgb(var(--tn-teal-rgb) / 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .wallet-dock-label {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .wallet-dock-btn.connected {
            border-color: rgb(var(--tn-teal-rgb) / 0.35);
        }

        .wallet-dock-btn.connected .wallet-dock-icon {
            background: rgb(var(--tn-teal-rgb) / 0.2);
        }

        .wallet-dock-fab {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgb(var(--tn-coral-rgb) / 0.25);
            background: rgb(var(--tn-coral-rgb) / 0.08);
            color: var(--tn-coral);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .wallet-dock-fab:hover {
            background: rgb(var(--tn-coral-rgb) / 0.15);
            border-color: rgb(var(--tn-coral-rgb) / 0.4);
        }

        @media (max-width: 480px) {
            .wallet-dock-label {
                display: none;
            }

            .wallet-dock-btn {
                padding: 0.55rem;
                border-radius: 50%;
            }
        }

        /* Planes live in storage until a catalog card opens them */
        .plane-nav { display: none !important; }

        #plane-storage {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            padding: 0;
            margin: -1px;
        }

        .plane {
            width: 100%;
            display: block;
        }

        .plane-card {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            text-align: left;
        }

        .plane-card h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--tn-mint);
            margin: 0 0 0.55rem;
            overflow-wrap: anywhere;
        }

        .plane-card p {
            font-size: var(--eco-text);
            color: var(--tn-text);
            line-height: 1.55;
            margin: 0 0 0.75rem;
        }

        .plane-card ul {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem;
        }

        .plane-card li {
            font-size: var(--eco-text);
            color: var(--tn-text);
            line-height: 1.5;
            padding: 0.15rem 0 0.15rem 1rem;
            position: relative;
        }

        .plane-card li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: rgb(var(--tn-teal-rgb) / max(0.45, var(--tn-alpha-floor)));
            font-size: 0.9rem;
        }

        .eco-svg-live { margin: 0 0 0.75rem; overflow-x: auto; }
        .eco-svg-state { font-size: var(--tn-size-caption, 0.78rem); color: var(--tn-text-3, rgb(var(--tn-text-rgb) / 0.6)); }
        .eco-svg-table { width: 100%; border-collapse: collapse; font-size: var(--eco-text); font-variant-numeric: tabular-nums; }
        .eco-svg-table th { text-align: left; font-size: var(--tn-size-label, 0.66rem); font-weight: 500; letter-spacing: var(--tn-track-label, 0.08em); text-transform: uppercase; color: var(--tn-text-3, rgb(var(--tn-text-rgb) / 0.6)); padding: 0.3rem 0.6rem 0.3rem 0; border-bottom: 1px solid var(--tn-line, rgb(var(--tn-teal-rgb) / 0.14)); }
        .eco-svg-table td { padding: 0.4rem 0.6rem 0.4rem 0; color: var(--tn-text-2, var(--tn-text)); border-bottom: 1px solid var(--tn-line-soft, rgb(var(--tn-teal-rgb) / 0.07)); white-space: nowrap; }
        .eco-svg-name { color: var(--tn-text-1, var(--tn-text-bright)); text-decoration: none; }
        .eco-svg-name:hover, .eco-svg-name:focus-visible { color: var(--tn-accent, var(--tn-teal)); text-decoration: underline; text-underline-offset: 3px; }
        .eco-svg-sym { margin-left: 0.45rem; font-size: var(--tn-size-caption, 0.72rem); color: var(--tn-text-3, rgb(var(--tn-text-rgb) / 0.6)); }
        .eco-svg-retry { background: none; border: 1px solid currentColor; border-radius: 2px; color: inherit; font: inherit; padding: 0.1rem 0.5rem; cursor: pointer; }

        .plane-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .plane-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            min-height: 2.25rem;
            padding: 0.36rem 0.7rem;
            border-radius: var(--tn-radius-ctl, 2px);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.45);
            background: transparent;
            color: var(--tn-text-bright, var(--tn-text));
            font-family: var(--tn-font, inherit);
            font-size: 0.88rem;
            font-weight: var(--tn-font-weight-medium, 500);
            letter-spacing: var(--tn-track-nav, 0.01em);
            line-height: 1.25;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .plane-link:hover {
            color: var(--tn-mint);
            border-color: var(--tn-teal);
            background: rgb(var(--tn-teal-rgb) / 0.06);
        }

        .plane-link:focus-visible {
            outline: 2px solid var(--tn-teal);
            outline-offset: 2px;
        }

        .plane-link.secondary {
            /* same Connect control; secondary is not a second colour box */
            color: var(--tn-text-bright, var(--tn-text));
            border-color: rgb(var(--tn-teal-rgb) / 0.45);
            background: transparent;
        }

        .plane-link.secondary:hover {
            color: var(--tn-mint);
            border-color: var(--tn-teal);
            background: rgb(var(--tn-teal-rgb) / 0.06);
        }

        html[data-theme="permissionless"] .plane-link:hover {
            box-shadow: var(--tn-glow-ring);
        }

        /* Abstract plane: subhead + state table */
        .abstract-subhead {
            font-size: 1.0625rem;
            font-weight: 500;
            color: var(--tn-mint);
            margin: 1.1rem 0 0.5rem;
        }
        .abstract-state {
            margin: 1rem 0 1.1rem;
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.14);
            border-radius: 8px;
            overflow: hidden;
            background: rgb(var(--tn-shade-rgb) / 0.28);
        }
        .abstract-state-loading {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            color: rgb(var(--tn-text-rgb) / max(0.6, var(--tn-alpha-floor)));
        }
        .abstract-state-error {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            color: var(--tn-coral);
        }
        .abstract-state-meta {
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            color: rgb(var(--tn-text-rgb) / max(0.5, var(--tn-alpha-floor)));
            border-bottom: 1px solid rgb(var(--tn-teal-rgb) / 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
            align-items: center;
        }
        .abstract-state-meta a { color: var(--tn-teal); text-decoration: none; }
        .abstract-state-meta a:hover { text-decoration: underline; }
        .abstract-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .abstract-table th,
        .abstract-table td {
            text-align: left;
            padding: 0.55rem 1rem;
            border-bottom: 1px solid rgb(var(--tn-teal-rgb) / 0.07);
            vertical-align: top;
        }
        .abstract-table th {
            font-weight: 500;
            color: rgb(var(--tn-teal-rgb) / max(0.8, var(--tn-alpha-floor)));
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
            background: rgb(var(--tn-teal-rgb) / 0.04);
        }
        .abstract-table td.module {
            color: var(--tn-mint);
            font-weight: 500;
            white-space: nowrap;
        }
        .abstract-table td.addr code,
        .abstract-table td.codeid code {
            font-family: var(--tn-font-mono);
            font-size: 0.82rem;
            color: var(--tn-text);
            word-break: break-all;
        }
        .abstract-table td.codeid code { color: var(--tn-purple); }
        .abstract-table tr:last-child td { border-bottom: none; }

        .badge-soon {
            display: inline-block;
            margin-left: 0.4rem;
            font-size: var(--tn-size-label);
            letter-spacing: var(--tn-track-label);
            text-transform: uppercase;
            padding: 0.15rem 0.45rem;
            border-radius: 3px;
            border: 1px solid rgb(var(--tn-amber-rgb) / 0.4);
            color: var(--tn-amber);
            background: rgb(var(--tn-amber-rgb) / 0.08);
            vertical-align: middle;
        }

        .lifecycle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem;
            margin: 1rem 0;
        }

        @media (max-width: 520px) {
            .lifecycle-grid {
                grid-template-columns: 1fr;
            }
        }

        .lifecycle-item {
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.12);
            border-radius: 8px;
            padding: 0.75rem 0.85rem;
            background: rgb(var(--tn-teal-rgb) / 0.03);
        }

        .lifecycle-item strong {
            display: block;
            color: var(--tn-teal);
            font-size: 0.78rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: var(--tn-track-label);
        }

        .lifecycle-item span {
            font-size: 0.78rem;
            color: var(--tn-text);
            line-height: 1.5;
        }

        .code-inline {
            font-family: var(--tn-font-mono);
            font-size: 0.75rem;
            background: rgb(var(--tn-teal-rgb) / 0.06);
            border: 1px solid rgb(var(--tn-teal-rgb) / 0.15);
            border-radius: 3px;
            padding: 0.1rem 0.35rem;
            color: var(--tn-teal);
        }
        .eco-list-foot {
            margin: 1.25rem 0 0.25rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.55rem 0.85rem;
        }
        .eco-list-foot .muted {
            font-size: 0.88rem;
            color: var(--tn-text-dim);
            margin: 0;
        }
        .doc-section:focus {
            outline: none;
        }
        .doc-section:focus-visible {
            outline: 2px solid var(--tn-teal);
            outline-offset: 4px;
        }
        .doc-text a {
            color: var(--tn-teal);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .doc-text a:hover { color: var(--tn-mint); }
        .doc-steps {
            margin: 0.55rem 0 0;
            padding-left: 1.15rem;
            color: var(--tn-text);
            font-size: 0.92rem;
            line-height: 1.55;
        }
